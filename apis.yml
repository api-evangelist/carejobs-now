aid: carejobs-now

name: CareJobs.Now

image: https://carejobs.now/opengraph-image

description: CareJobs.Now aggregates US healthcare job listings and posted pay rates from over 258 employers, providing open datasets of hourly
  wages, job types, and employer information. Users can browse jobs, explore pay research, and download JSON/CSV files without authentication.
  The platform aims to increase transparency in healthcare compensation and simplify job search for nurses, CNAs, therapists, and other care professionals.

